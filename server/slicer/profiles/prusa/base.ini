# Printynozzle base config — Bambu Studio equivalent (Prusa-family CLI).
# The per-quote overrides below it are generated by server/utils/bambuSlicer.js
# so every quote slices with the EXACT same settings shown in the storefront:
# 0.20mm layers, 2 wall loops, 5 top / 3 bottom shells, grid infill,
# tree(auto) supports at 30 degrees, 1.75mm filament.

layer_height = 0.2
first_layer_height = 0.24
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 3
fill_density = 50%
fill_pattern = grid
support_material = 1
support_material_auto = 1
support_material_style = tree
support_material_threshold = 30
seam_position = aligned
filament_diameter = 1.75
perimeter_extrusion_width = 0.42
external_perimeter_extrusion_width = 0.42
infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4
